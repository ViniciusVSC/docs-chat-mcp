# Conjunto de avaliação do docs-chat-mcp (10 perguntas sobre legislação + 10 sobre tabelas)
questions:
  # =========================================================================
  # A) 10 Perguntas sobre Legislação (CLT, CDC, LGPD, Marco Civil da Internet)
  # =========================================================================
  - id: law_01
    category: text
    question: "Qual o prazo de férias previsto na CLT após cada período de 12 meses de vigência do contrato?"
    expected_doc_id: "clt"
    expected_articles: ["Art. 130", "Art. 129"]
    expected_keywords: ["30", "dias", "corridos", "130"]

  - id: law_02
    category: text
    question: "Qual a duração normal do trabalho diário prevista no Art. 58 da CLT?"
    expected_doc_id: "clt"
    expected_articles: ["Art. 58"]
    expected_keywords: ["8", "oito", "horas", "diárias"]

  - id: law_03
    category: text
    question: "Segundo o Art. 487 da CLT, qual é o prazo mínimo de aviso prévio quando o pagamento é mensal ou o empregado tem mais de 12 meses?"
    expected_doc_id: "clt"
    expected_articles: ["Art. 487"]
    expected_keywords: ["trinta dias", "30", "487"]

  - id: law_04
    category: text
    question: "Quais condutas constituem justa causa para rescisão do contrato de trabalho pelo empregador no Art. 482 da CLT?"
    expected_doc_id: "clt"
    expected_articles: ["Art. 482"]
    expected_keywords: ["improbidade", "indisciplina", "insubordinação", "abandono"]

  - id: law_05
    category: text
    question: "Qual é o prazo de arrependimento para o consumidor desistir do contrato em compras fora do estabelecimento comercial segundo o Art. 49 do CDC?"
    expected_doc_id: "cdc"
    expected_articles: ["Art. 49"]
    expected_keywords: ["7 dias", "sete dias", "49"]

  - id: law_06
    category: text
    question: "Qual o prazo para reclamar pelos vícios aparentes ou de fácil constatação em produtos e serviços duráveis e não duráveis no Art. 26 do CDC?"
    expected_doc_id: "cdc"
    expected_articles: ["Art. 26"]
    expected_keywords: ["trinta dias", "noventa dias", "30", "90"]

  - id: law_07
    category: text
    question: "Em quantos dias o fornecedor deve sanar o vício do produto antes que o consumidor possa exigir a substituição segundo o Art. 18 do CDC?"
    expected_doc_id: "cdc"
    expected_articles: ["Art. 18"]
    expected_keywords: ["trinta dias", "30", "18"]

  - id: law_08
    category: text
    question: "O que a LGPD diz sobre o consentimento do titular de dados pessoais nos artigos 5º, 7º e 8º?"
    expected_doc_id: "lgpd"
    expected_articles: ["Art. 8", "Art. 7", "Art. 5"]
    expected_keywords: ["consentimento", "titular", "escrito", "finalidades", "revogado"]

  - id: law_09
    category: text
    question: "Como a LGPD define dado pessoal sensível no Art. 5º e regula seu tratamento no Art. 11?"
    expected_doc_id: "lgpd"
    expected_articles: ["Art. 5", "Art. 11"]
    expected_keywords: ["racial", "religiosa", "saúde", "biométrico", "genético", "sensível"]

  - id: law_10
    category: text
    question: "O que o Art. 9º do Marco Civil da Internet estabelece sobre a neutralidade da rede?"
    expected_doc_id: "marco_civil_internet"
    expected_articles: ["Art. 9"]
    expected_keywords: ["isonômico", "pacotes", "dados", "tráfego", "9"]

